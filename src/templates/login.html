<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - Telegram 管理中心</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
           <line x1="22" y1="2" x2="11" y2="13"></line>
           <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </div>
      <h2>欢迎回来</h2>
      <p>请登录以管理您的 Telegram 转发服务</p>
    </div>

    {% if error %}
    <div style="background: var(--danger-bg); color: var(--danger); padding: 0.75rem; border-radius: 10px; margin-bottom: 1.5rem; font-size: 0.9rem; text-align: center; border: 1px solid rgba(239, 68, 68, 0.2);">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="username">账号</label>
        <input id="username" name="username" type="text" required placeholder="请输入管理员账号" autofocus>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" required placeholder="请输入密码">
      </div>
      
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; height: 48px; font-size: 1rem;">
        安全登录
      </button>
    </form>
    
    <div class="login-footer">
       Telegram Config Center &copy; 2025
    </div>
  </div>
</body>
</html>
