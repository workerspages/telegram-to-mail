<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Telegram 配置中心</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
  <header class="main-header">
    <h2>Telegram 配置中心</h2>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="openAddGroupModal()" title="添加群组监听">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span style="margin-left:6px">群组</span>
      </button>
      <button class="btn btn-primary" onclick="openScraperModal()" title="网页爬虫订阅" style="background: linear-gradient(to right, #10b981, #059669);">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        <span style="margin-left:6px">订阅</span>
      </button>
      <button class="btn btn-secondary" onclick="openScheduleModal()" title="定时任务">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span style="margin-left:6px">任务</span>
      </button>
      <button class="btn-icon" onclick="openNotifierModal()" title="设置"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 0 2l-.15.08a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1 0-2l.15-.08a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      <button class="btn-icon btn-icon-danger" onclick="logout()"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></button>
    </div>
  </header>

  <main id="groupList"></main>
</div>

<!-- 推送通道弹窗 -->
<div id="notifierModalMask" class="modal-mask">
  <div class="modal">
    <div class="modal-header"><h2>推送通道设置</h2><button class="close" onclick="closeNotifierModal()">&times;</button></div>
    <form id="notifierForm" style="display:flex; flex-direction:column; height:100%;">
      <div class="modal-body">
        <h4 style="color:var(--text-secondary); margin-bottom:1rem;">Email (SMTP)</h4>
        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:1rem;">
            <div class="form-group"><label>Host</label><input id="msmtp_host" type="text"></div>
            <div class="form-group"><label>Port</label><input id="msmtp_port" type="text"></div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
            <div class="form-group"><label>Username</label><input id="msmtp_user" type="text"></div>
            <div class="form-group"><label>Password</label><input id="msmtp_pass" type="password"></div>
        </div>
        <div class="form-group"><label>From Address</label><input id="msmtp_from" type="text"></div>
        <hr style="margin:2rem 0; border:0; border-top:1px solid var(--border);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
             <h4 style="margin:0; font-size:0.9rem; color:var(--text-secondary);">Bark Devices</h4>
             <button type="button" class="btn btn-secondary" onclick="addGlobalToken('bark')" style="height:28px;">+ 添加</button>
        </div>
        <div id="barkTokenList"></div>
      </div>
      <div class="modal-actions"><button type="submit" class="btn btn-primary">保存设置</button></div>
    </form>
  </div>
</div>

<!-- 添加群组弹窗 -->
<div id="addGroupModalMask" class="modal-mask">
  <div class="modal">
    <div class="modal-header"><h2>添加新群组</h2><button class="close" onclick="closeAddGroupModal()">&times;</button></div>
    <form id="addGroupForm">
      <div class="modal-body">
        <div class="form-group"><label>群组 ID</label><input type="text" id="modalGroupId" required placeholder="-100..."></div>
        <div class="form-group"><label>备注名称</label><input type="text" id="modalGroupName" placeholder="例如: 某某频道"></div>
      </div>
      <div class="modal-actions"><button type="submit" class="btn btn-primary">保存群组</button></div>
    </form>
  </div>
</div>

<script>
let configData = {{ config|tojson|safe }};
async function saveConfigToServer() {
    const r = await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(configData)});
    return r.ok;
}

function toggleGroup(idx) { document.getElementById(`group-card-${idx}`).classList.toggle('expanded'); }

function renderGroups(expandedIndex = -1) {
  const container = document.getElementById('groupList');
  if (!configData.groups || configData.groups.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding: 4rem; color: #999;">暂无监听群组</div>`;
    return;
  }
  container.innerHTML = configData.groups.map((g, idx) => {
      const isExpanded = idx === expandedIndex;
      return `<div class="group-card ${isExpanded ? 'expanded' : ''}" id="group-card-${idx}">
        <div class="group-card-header" onclick="toggleGroup(${idx})">
          <div class="toggle-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
          <div class="group-title">${g.name || '未命名'}<span class="id-badge">${g.id}</span></div>
          <button class="btn-icon btn-icon-danger" onclick="deleteGroup(event, ${idx})"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
        </div>
        <div class="group-card-body">
            <div class="form-group">
              <label>默认推送通道</label>
              ${renderNotifierCheckboxes(idx, g.default_notifiers || [])}
            </div>

            <!-- ★★★ 新功能：自动转发设置 ★★★ -->
            <div class="form-group" style="margin-top:2rem; padding-top:1.5rem; border-top:1px dashed var(--border);">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <label style="margin:0">消息转发到 (目标ID)</label>
                <button type="button" class="btn btn-secondary" onclick="addForwardTarget(${idx})" style="height:28px; font-size:0.75rem;">+ 转发目标</button>
              </div>
              <div id="fwdlist-${idx}">
                ${(g.forward_targets || []).map((fwd, fi) => `
                    <div style="display:flex; gap:0.5rem; margin-bottom:0.5rem;">
                        <input type="text" value="${fwd.target_id || ''}" placeholder="例如: -100xxxxxxxx" onchange="configData.groups[${idx}].forward_targets[${fi}].target_id=this.value.trim();saveConfigToServer();">
                        <button class="btn-icon btn-icon-danger" onclick="configData.groups[${idx}].forward_targets.splice(${fi},1);saveConfigToServer();renderGroups(${idx});" style="border:1px solid var(--border);">&times;</button>
                    </div>
                `).join('')}
              </div>
            </div>

            <!-- ★★★ 新功能：自动删除设置 ★★★ -->
            <div class="form-group" style="margin-top:2rem; padding:1.25rem; border-radius:12px; background:#fff9f9; border:1px solid #ffebeb;">
              <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
                <label style="margin:0; color:#c53030; font-weight:bold;">开启自动删除消息</label>
                <label class="switch-label ${g.auto_delete_enabled ? 'checked' : ''}">
                   <input type="checkbox" ${g.auto_delete_enabled ? 'checked' : ''} onchange="configData.groups[${idx}].auto_delete_enabled=this.checked;saveConfigToServer();renderGroups(${idx});">
                   <div class="slider-track"><div class="slider-thumb"></div></div>
                </label>
              </div>
              ${g.auto_delete_enabled ? `
                <div style="display:flex; align-items:center; gap:1rem;">
                    <span style="font-size:0.85rem; color:#c53030;">删除延迟 (秒):</span>
                    <input type="number" value="${g.delete_delay || 60}" min="1" style="width:100px; border-color:#feb2b2;" onchange="configData.groups[${idx}].delete_delay=parseInt(this.value);saveConfigToServer();">
                </div>
              ` : ''}
            </div>

            <div class="form-group" style="margin-top:2rem; padding-top:1.5rem; border-top:1px dashed var(--border);">
              <label>关键字推送规则</label>
              <button type="button" class="btn btn-secondary" onclick="addKeywordToGroup(${idx})" style="height:28px; margin-left:1rem;">+ 规则</button>
              <div id="kwlist-${idx}">${(g.keywords || []).map((kw, ki) => `
                <div class="list-card" style="margin-top:1rem;">
                    <input type="text" value="${kw.word}" placeholder="关键字" onchange="configData.groups[${idx}].keywords[${ki}].word=this.value;saveConfigToServer();">
                    <input type="text" value="${kw.reply_content||''}" placeholder="回复内容" onchange="configData.groups[${idx}].keywords[${ki}].reply_content=this.value;saveConfigToServer();" style="margin-top:0.5rem;">
                </div>`).join('')}</div>
            </div>
        </div>
      </div>`;
  }).join('');
}

function renderNotifierCheckboxes(gi, selected) {
    let opts = [{id:'email', name:'Email'}];
    (configData.notifiers.bark || []).forEach(n => opts.push({id:n.id, name:'Bark'}));
    return `<div class="switch-grid">${opts.map(o => `<label class="switch-label ${selected.includes(o.id)?'checked':''}"><input type="checkbox" value="${o.id}" ${selected.includes(o.id)?'checked':''} onchange="updateGroupNotifier(${gi}, this)"> <div class="slider-track"><div class="slider-thumb"></div></div><span class="switch-text">${o.name}</span></label>`).join('')}</div>`;
}
function updateGroupNotifier(gi, el) {
    let g = configData.groups[gi]; if(!g.default_notifiers) g.default_notifiers=[];
    if(el.checked) g.default_notifiers.push(el.value); else g.default_notifiers=g.default_notifiers.filter(v=>v!==el.value);
    saveConfigToServer(); renderGroups(gi);
}
function addForwardTarget(gi) { if(!configData.groups[gi].forward_targets) configData.groups[gi].forward_targets=[]; configData.groups[gi].forward_targets.push({target_id:''}); renderGroups(gi); }
function addKeywordToGroup(gi) { if(!configData.groups[gi].keywords) configData.groups[gi].keywords=[]; configData.groups[gi].keywords.push({word:'', notifiers:['email']}); renderGroups(gi); }
function deleteGroup(e, i) { e.stopPropagation(); if(confirm('删除?')) { configData.groups.splice(i,1); saveConfigToServer(); renderGroups(); } }

function openNotifierModal() { document.getElementById('notifierModalMask').classList.add('active'); }
function closeNotifierModal() { document.getElementById('notifierModalMask').classList.remove('active'); }
function openAddGroupModal() { document.getElementById('addGroupModalMask').classList.add('active'); }
function closeAddGroupModal() { document.getElementById('addGroupModalMask').classList.remove('active'); }
document.getElementById('addGroupForm').onsubmit = async (e) => {
    e.preventDefault();
    configData.groups.push({id:document.getElementById('modalGroupId').value, name:document.getElementById('modalGroupName').value, keywords:[], forward_targets:[], auto_delete_enabled:false});
    if(await saveConfigToServer()) { closeAddGroupModal(); renderGroups(); }
};

function logout() { location.href='/logout'; }
renderGroups();
</script>
</body>
</html>
