<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Telegram 配置中心</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
  <header class="main-header">
    <h2>Telegram 配置中心</h2>
    <div class="header-actions">
      <!-- 原有按钮 -->
      <button class="btn btn-primary" onclick="openAddGroupModal()" title="添加群组监听">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span style="margin-left:6px">群组</span>
      </button>

      <button class="btn btn-primary" onclick="openScraperModal()" title="网页爬虫订阅 (免登录)" style="background: linear-gradient(to right, #10b981, #059669);">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        <span style="margin-left:6px">订阅</span>
      </button>

      <!-- ★★★ 新增：自动删除按钮 ★★★ -->
      <button class="btn btn-secondary" onclick="openAutoDeleteModal()" title="自动删除消息">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>

      <!-- ★★★ 新增：消息转发按钮 ★★★ -->
      <button class="btn btn-secondary" onclick="openForwardModal()" title="消息转发">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
      </button>

      <button class="btn btn-secondary" onclick="openScheduleModal()" title="定时任务">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span style="margin-left:6px">任务</span>
      </button>
      <button class="btn-icon" onclick="openNotifierModal()" title="设置">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 0 2l-.15.08a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1 0-2l.15-.08a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
       <button class="btn-icon btn-icon-danger" onclick="logout()" title="退出">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      </button>
    </div>
  </header>

  <main id="groupList"></main>
</div>

<!-- ================= 弹窗：推送设置 ================= -->
<div id="notifierModalMask" class="modal-mask">
  <div class="modal">
    <div class="modal-header">
      <h2>推送通道设置</h2>
      <button class="close" onclick="closeNotifierModal()">&times;</button>
    </div>
    <form id="notifierForm" style="display:flex; flex-direction:column; height:100%;">
      <div class="modal-body">
        <div style="margin-bottom: 2rem;">
          <h4 style="margin:0 0 1rem; font-size:0.9rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.05em;">Email (SMTP)</h4>
          <div style="display:grid; grid-template-columns: 2fr 1fr; gap:1rem;">
              <div class="form-group"><label>Host</label><input id="msmtp_host" type="text" placeholder="smtp.example.com"></div>
              <div class="form-group"><label>Port</label><input id="msmtp_port" type="text" placeholder="587"></div>
          </div>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
              <div class="form-group"><label>Username</label><input id="msmtp_user" type="text"></div>
              <div class="form-group"><label>Password</label><input id="msmtp_pass" type="password"></div>
          </div>
          <div class="form-group" style="margin-bottom:0;"><label>From Address</label><input id="msmtp_from" type="text"></div>
        </div>

        <!-- ★★★ 修复：补回 Bark 设置区域 ★★★ -->
        <div style="margin-bottom: 2rem;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
             <h4 style="margin:0; font-size:0.9rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.05em;">Bark Devices</h4>
             <button type="button" class="btn btn-secondary" onclick="addGlobalToken('bark')" style="height:28px; font-size:0.8rem; padding:0 0.8rem;">+ 添加</button>
          </div>
          <div id="barkTokenList"></div>
        </div>

        <!-- ★★★ 修复：补回 Pushplus 设置区域 ★★★ -->
        <div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
             <h4 style="margin:0; font-size:0.9rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.05em;">Pushplus Tokens</h4>
             <button type="button" class="btn btn-secondary" onclick="addGlobalToken('pushplus')" style="height:28px; font-size:0.8rem; padding:0 0.8rem;">+ 添加</button>
          </div>
          <div id="pushTokenList"></div>
        </div>
      </div>
      <div class="modal-actions">
        <span id="notifierStatus" style="margin-right:auto; font-size:0.9rem; align-self:center;"></span>
        <button type="button" class="btn btn-secondary" onclick="closeNotifierModal()">取消</button>
        <button type="submit" class="btn btn-primary">保存设置</button>
      </div>
    </form>
  </div>
</div>

<!-- ================= 弹窗：添加群组 ================= -->
<div id="addGroupModalMask" class="modal-mask">
  <div class="modal">
     <div class="modal-header">
      <h2>添加新群组</h2>
      <button class="close" onclick="closeAddGroupModal()">&times;</button>
    </div>
    <form id="addGroupForm" style="display:flex; flex-direction:column; height:100%;">
      <div class="modal-body">
        <div class="form-group"><label>群组 ID</label><input type="text" id="modalGroupId" required placeholder="-100xxxxxxxxx"></div>
        <div class="form-group"><label>群组名称 (备注)</label><input type="text" id="modalGroupName" placeholder="例如: 技术交流群"></div>
        
        <div class="form-group" style="margin-top:1.5rem;">
          <label style="margin-bottom:0.8rem;">默认推送通道</label>
          <div id="modalDefaultNotifyContainer" class="switch-grid"></div>
        </div>

        <div class="form-group" style="margin-top:2rem;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem;">
            <label style="margin:0;">关键字规则 (可选)</label>
            <button type="button" class="btn btn-secondary" onclick="addKeywordRow()" style="height:28px; font-size:0.8rem;">+ 规则</button>
          </div>
          <div id="addGroupKeywords"></div>
        </div>

        <!-- ★★★ 新增：抽奖自动参与设置 ★★★ -->
        <div class="form-group" style="margin-top:2rem; padding:1rem; background:#f0fdf4; border-radius:12px; border:1px solid #bbf7d0;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <label style="margin:0; color:#16a34a; font-weight:600;">🎲 抽奖自动参与</label>
            <label class="switch-label" id="modalLotteryEnabled" style="margin:0; padding:4px 6px; border:none; background:transparent;">
              <input type="checkbox" id="modalLotteryEnabledInput">
              <div class="slider-track"><div class="slider-thumb"></div></div>
            </label>
          </div>
          <div id="modalLotterySettings" style="display:none;">
            <div class="form-group" style="margin-bottom:0.8rem;">
              <label style="font-size:0.8rem; color:var(--text-secondary);">触发关键词 (逗号分隔)</label>
              <input type="text" id="modalLotteryTriggerKeywords" placeholder="抽奖信息, 抽奖ID">
            </div>
            <div style="display:flex; gap:0.5rem;">
              <div style="flex:1;">
                <label style="font-size:0.8rem; color:var(--text-secondary);">最小延时(秒)</label>
                <input type="number" id="modalLotteryDelayMin" value="3" min="1">
              </div>
              <div style="flex:1;">
                <label style="font-size:0.8rem; color:var(--text-secondary);">最大延时(秒)</label>
                <input type="number" id="modalLotteryDelayMax" value="10" min="1">
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <span class="error-msg" id="addGroupError" style="margin-right:auto; color:var(--danger); font-size:0.9rem; align-self:center;"></span>
        <button type="button" class="btn btn-secondary" onclick="closeAddGroupModal()">取消</button>
        <button type="submit" class="btn btn-primary">保存群组</button>
      </div>
    </form>
  </div>
</div>

<!-- ================= 弹窗：定时任务 ================= -->
<div id="scheduleModalMask" class="modal-mask">
  <div class="modal">
    <div class="modal-header">
      <h2>定时任务 (每日签到)</h2>
      <button class="close" onclick="closeScheduleModal()">&times;</button>
    </div>
    <div class="modal-body" style="background: #f9fafb;">
      <div id="scheduleTaskList"></div>
      <button type="button" class="btn btn-secondary" onclick="addScheduleTask()" style="width: 100%; border-style:dashed;">+ 添加新任务</button>
    </div>
    <div class="modal-actions">
      <span id="scheduleStatus" style="margin-right:auto;"></span>
      <button type="button" class="btn btn-secondary" onclick="closeScheduleModal()">关闭</button>
    </div>
  </div>
</div>

<!-- ================= 弹窗：网页爬虫 ================= -->
<div id="scraperModalMask" class="modal-mask">
  <div class="modal">
    <div class="modal-header">
      <h2>Web 订阅 (无需登录 无封号风险)</h2>
      <button class="close" onclick="closeScraperModal()">&times;</button>
    </div>
    <div class="modal-body" style="background: #f9fafb;">
      <div style="background: #fff; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid var(--border); display:flex; align-items:center; justify-content:space-between;">
        <div>
          <label style="display:block; font-weight:600; font-size:0.9rem;">轮询频率</label>
          <span style="font-size:0.8rem; color:var(--text-secondary);">两次检查等待时间 (秒)</span>
        </div>
        <input type="number" id="scraperIntervalInput" min="10" step="10" style="width:80px; text-align:center;" onchange="updateScraperInterval(this.value)">
      </div>
      <div id="scraperList"></div>
      <button type="button" class="btn btn-secondary" onclick="addScraperItem()" style="width: 100%; border-style:dashed; margin-top:1rem;">+ 添加订阅频道</button>
    </div>
    <div class="modal-actions">
      <span id="scraperStatus" style="margin-right:auto;"></span>
      <button type="button" class="btn btn-secondary" onclick="closeScraperModal()">关闭</button>
    </div>
  </div>
</div>

<!-- ================= ★★★ 新增弹窗：自动删除消息 ★★★ ================= -->
<div id="autoDeleteModalMask" class="modal-mask">
  <div class="modal">
    <div class="modal-header">
      <h2>自动删除消息</h2>
      <button class="close" onclick="closeAutoDeleteModal()">&times;</button>
    </div>
    <div class="modal-body" style="background: #f9fafb;">
      <div class="form-group" style="text-align:center; margin-bottom:1rem;">
         <p style="color:var(--text-secondary); font-size:0.85rem; margin:0;">请确保填写的 Bot 已加入该群组并设为管理员。</p>
      </div>
      <div id="autoDeleteList"></div>
      <button type="button" class="btn btn-secondary" onclick="addAutoDeleteItem()" style="width: 100%; border-style:dashed;">+ 添加规则</button>
    </div>
    <div class="modal-actions">
      <span id="autoDeleteStatus" style="margin-right:auto; font-size:0.9rem; align-self:center;"></span>
      <button type="button" class="btn btn-secondary" onclick="closeAutoDeleteModal()">关闭</button>
    </div>
  </div>
</div>

<!-- ================= ★★★ 新增弹窗：消息转发 ★★★ ================= -->
<div id="forwardModalMask" class="modal-mask">
  <div class="modal">
    <div class="modal-header">
      <h2>消息转发</h2>
      <button class="close" onclick="closeForwardModal()">&times;</button>
    </div>
    <div class="modal-body" style="background: #f9fafb;">
      <div class="form-group" style="text-align:center; margin-bottom:1rem;">
         <p style="color:var(--text-secondary); font-size:0.85rem; margin:0;">Bot 需在源群组和目标群组中。</p>
      </div>
      <div id="forwardList"></div>
      <button type="button" class="btn btn-secondary" onclick="addForwardItem()" style="width: 100%; border-style:dashed;">+ 添加转发规则</button>
    </div>
    <div class="modal-actions">
      <span id="forwardStatus" style="margin-right:auto; font-size:0.9rem; align-self:center;"></span>
      <button type="button" class="btn btn-secondary" onclick="closeForwardModal()">关闭</button>
    </div>
  </div>
</div>


<!-- ================= JAVASCRIPT 逻辑 ================= -->
<script>
let configData = {{ config|tojson|safe }};

// 初始化数据结构
if (!configData.scheduled_tasks) configData.scheduled_tasks = [];
if (!configData.scrape_channels) configData.scrape_channels = [];
if (!configData.auto_delete_rules) configData.auto_delete_rules = [];
if (!configData.forward_rules) configData.forward_rules = [];

const pushTypes = { bark: "Bark", pushplus: "Pushplus", email: "Email" };

async function saveConfigToServer() {
    try {
        const response = await fetch('/api/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(configData)
        });
        return response.ok;
    } catch (error) { console.error(error); return false; }
}

/* --- UI Helpers --- */
function toggleGroup(idx) {
    document.getElementById(`group-card-${idx}`)?.classList.toggle('expanded');
}

function getAvailableNotifiers() {
    let options = [{ id: 'email', name: 'Email' }];
    if (configData.notifiers.bark) {
        configData.notifiers.bark.forEach(n => options.push({ id: n.id, name: n.id }));
    }
    if (configData.notifiers.pushplus) {
        configData.notifiers.pushplus.forEach(n => options.push({ id: n.id, name: n.id }));
    }
    return options;
}

/* --- Modals --- */
function openNotifierModal(){
    renderNotifierModal(); 
    document.getElementById('notifierModalMask').classList.add('active'); 
}
function closeNotifierModal(){
    document.getElementById('notifierModalMask').classList.remove('active'); 
}

function openAddGroupModal(){
    document.getElementById('addGroupForm').reset();
    document.getElementById('addGroupModalMask').classList.add('active');
    renderModalDefaultNotify([]);
    renderKeywordRows([]);
    // 重置抽奖设置
    document.getElementById('modalLotteryEnabledInput').checked = false;
    document.getElementById('modalLotterySettings').style.display = 'none';
    document.getElementById('modalLotteryTriggerKeywords').value = '抽奖信息, 抽奖ID';
    document.getElementById('modalLotteryDelayMin').value = 3;
    document.getElementById('modalLotteryDelayMax').value = 10;
}
function closeAddGroupModal(){
    document.getElementById('addGroupModalMask').classList.remove('active');
}

function openScheduleModal(){
    renderScheduleList();
    document.getElementById('scheduleModalMask').classList.add('active');
}
function closeScheduleModal(){
    document.getElementById('scheduleModalMask').classList.remove('active');
}

function openScraperModal() {
    renderScraperList();
    document.getElementById('scraperIntervalInput').value = configData.scraper_interval || 60;
    document.getElementById('scraperModalMask').classList.add('active');
}
function closeScraperModal() {
    document.getElementById('scraperModalMask').classList.remove('active');
}

// ★★★ 新增：Modal Open/Close Logic ★★★
function openAutoDeleteModal() {
    renderAutoDeleteList();
    document.getElementById('autoDeleteModalMask').classList.add('active');
    document.getElementById('autoDeleteStatus').textContent = "";
}
function closeAutoDeleteModal() {
    document.getElementById('autoDeleteModalMask').classList.remove('active');
}

function openForwardModal() {
    renderForwardList();
    document.getElementById('forwardModalMask').classList.add('active');
    document.getElementById('forwardStatus').textContent = "";
}
function closeForwardModal() {
    document.getElementById('forwardModalMask').classList.remove('active');
}


/* --- ★★★ 渲染逻辑：自动删除消息 (Auto Delete) ★★★ --- */
function renderAutoDeleteList() {
    const container = document.getElementById('autoDeleteList');
    if (configData.auto_delete_rules.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#9ca3af; padding: 2rem;">暂无删除规则</div>';
        return;
    }
    container.innerHTML = configData.auto_delete_rules.map((rule, idx) => `
        <div class="list-card ${rule.enabled === false ? 'disabled-item' : ''}">
            <div style="display: flex; justify-content:space-between; align-items:center; margin-bottom: 0.8rem;">
                <div style="display:flex; align-items:center; gap:0.5rem;">
                    <span style="font-weight:600;">规则 #${idx + 1}</span>
                    ${rule.enabled === false ? '<span style="padding:2px 6px; background:#fef2f2; color:#dc2626; border-radius:4px; font-size:0.7rem;">已暂停</span>' : ''}
                </div>
                <div style="display:flex; align-items:center; gap:0.5rem;">
                    <label class="switch-label ${rule.enabled !== false ? 'checked' : ''}" style="margin:0; padding:4px 6px; border:none; background:transparent;">
                        <input type="checkbox" ${rule.enabled !== false ? 'checked' : ''} onchange="toggleAutoDeleteEnabled(${idx}, this.checked)">
                        <div class="slider-track"><div class="slider-thumb"></div></div>
                    </label>
                    <button type="button" class="btn-icon btn-icon-danger" onclick="removeAutoDelete(${idx})" title="删除" style="display:inline-flex; border: 1px solid var(--border); border-radius: 10px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>
            <div style="display: flex; gap:0.5rem; margin-bottom: 0.8rem;">
                <div style="flex:1;">
                    <label style="font-size:0.8rem; color:var(--text-secondary);">群组 ID (Group ID)</label>
                    <input type="text" value="${rule.group_id || ''}" placeholder="如: -100xxxx" onchange="updateAutoDelete(${idx}, 'group_id', this.value)">
                </div>
                <div style="width:80px;">
                    <label style="font-size:0.8rem; color:var(--text-secondary);">延迟(秒)</label>
                    <input type="number" value="${rule.delay || 60}" placeholder="60" onchange="updateAutoDelete(${idx}, 'delay', this.value)" style="text-align:center;">
                </div>
            </div>
            <div>
                 <label style="font-size:0.8rem; color:var(--text-secondary);">Telegram Bot Token</label>
                 <input type="text" value="${rule.bot_token || ''}" placeholder="123456:ABC-DEF..." onchange="updateAutoDelete(${idx}, 'bot_token', this.value)">
            </div>
        </div>
    `).join('');
}

async function addAutoDeleteItem() {
    configData.auto_delete_rules.push({ group_id: '', delay: 60, bot_token: '', enabled: true });
    if (await saveConfigToServer()) renderAutoDeleteList();
}

async function removeAutoDelete(idx) {
    if(confirm("删除此规则？")) {
        configData.auto_delete_rules.splice(idx, 1);
        if (await saveConfigToServer()) renderAutoDeleteList();
    }
}

async function updateAutoDelete(idx, key, value) { 
    configData.auto_delete_rules[idx][key] = value; 
    const s = document.getElementById('autoDeleteStatus');
    s.textContent = "保存中..."; 
    if(await saveConfigToServer()) {
        s.textContent = "已保存";
        setTimeout(() => s.textContent="", 1000);
    }
}

async function toggleAutoDeleteEnabled(idx, enabled) {
    configData.auto_delete_rules[idx].enabled = enabled;
    if (await saveConfigToServer()) renderAutoDeleteList();
}

/* --- ★★★ 渲染逻辑：消息转发 (Forward) ★★★ --- */
function renderForwardList() {
    const container = document.getElementById('forwardList');
    if (configData.forward_rules.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#9ca3af; padding: 2rem;">暂无转发规则</div>';
        return;
    }
    container.innerHTML = configData.forward_rules.map((rule, idx) => `
        <div class="list-card ${rule.enabled === false ? 'disabled-item' : ''}">
            <div style="display: flex; justify-content:space-between; align-items:center; margin-bottom: 0.8rem;">
                <div style="display:flex; align-items:center; gap:0.5rem;">

async function updateGroupLotteryEnabled(gId, enabled) {
    if (!configData.groups[gId].lottery) {
        configData.groups[gId].lottery = { enabled: false, trigger_keywords: ['抽奖信息', '抽奖ID'], reply_delay_min: 3, reply_delay_max: 10 };
    }
    configData.groups[gId].lottery.enabled = enabled;
    await saveConfigToServer();
    renderGroups();
}

async function updateGroupLotteryKeywords(gId, value) {
    if (!configData.groups[gId].lottery) return;
    configData.groups[gId].lottery.trigger_keywords = value.split(',').map(s => s.trim()).filter(s => s);
    await saveConfigToServer();
}

async function updateGroupLotteryDelay(gId, type, value) {
    if (!configData.groups[gId].lottery) return;
    if (type === 'min') {
        configData.groups[gId].lottery.reply_delay_min = parseInt(value) || 3;
    } else {
        configData.groups[gId].lottery.reply_delay_max = parseInt(value) || 10;
    }
    await saveConfigToServer();
}

        <div class="list-card" style="margin-bottom:0.5rem; padding:0.8rem;">
            <div style="display:flex; gap:0.5rem; margin-bottom:0.5rem;">
                <input type="text" value="${kw.word||''}" onchange="updateNewKeywordWord(${idx}, this.value)" placeholder="关键字">
                <button type="button" class="btn-icon btn-icon-danger" onclick="removeKeywordRow(${idx})">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div style="margin-bottom:0.8rem;">
                <div class="switch-grid" id="modal-kw-${idx}">
                    ${getAvailableNotifiers().map(opt => `
                        <label class="switch-label ${(kw.notifiers||[]).includes(opt.id)?'checked':''}">
                            <input type="checkbox" value="${opt.id}" ${(kw.notifiers||[]).includes(opt.id)?'checked':''}>
                            <div class="slider-track"><div class="slider-thumb"></div></div>
                            <span class="switch-text">${opt.name}</span>
                        </label>`).join('')}
                </div>
            </div>
            <div style="display: flex; gap: 0.8rem; align-items: flex-end;">
                <div style="flex-grow: 1;">
                    <label style="font-size:0.75rem;">自动回复</label>
                    <input type="text" value="${kw.reply_content||''}" onchange="updateNewKeywordReply(${idx}, this.value)">
                </div>
                <div style="width: 80px;">
                    <label style="font-size:0.75rem;">延迟(秒)</label>
                    <input type="number" value="${kw.reply_delay||5}" onchange="updateNewKeywordDelay(${idx}, this.value)">
                </div>
            </div>
        </div>`).join('');
}
function addKeywordRow(){
    addGroupKeywords.push({word:'', notifiers:[], reply_content:'', reply_delay: 5});
    renderKeywordRows(addGroupKeywords);
}
function removeKeywordRow(idx){
    addGroupKeywords.splice(idx, 1);
    renderKeywordRows(addGroupKeywords);
}
function renderModalDefaultNotify(selectedValues){
    document.getElementById('modalDefaultNotifyContainer').innerHTML = getAvailableNotifiers().map(opt => `
        <label class="switch-label ${selectedValues.includes(opt.id)?'checked':''}">
            <input type="checkbox" value="${opt.id}" ${selectedValues.includes(opt.id)?'checked':''}>
            <div class="slider-track"><div class="slider-thumb"></div></div>
            <span class="switch-text">${opt.name}</span>
        </label>`).join('');
}

function updateNewKeywordWord(idx, val){ addGroupKeywords[idx].word = val.trim(); }
function updateNewKeywordReply(idx, val){ addGroupKeywords[idx].reply_content = val; }
function updateNewKeywordDelay(idx, val){ addGroupKeywords[idx].reply_delay = val; }

document.getElementById('addGroupForm').onsubmit = async function(e){
    e.preventDefault();
    const gid = document.getElementById('modalGroupId').value.trim();
    if(!gid) return document.getElementById('addGroupError').textContent="ID必填";
  
    addGroupKeywords.forEach((kw, i) => {
        kw.notifiers = Array.from(document.querySelectorAll(`#modal-kw-${i} input:checked`)).map(el=>el.value);
    });
  
    // 处理抽奖设置
    let lotteryConfig = null;
    if (document.getElementById('modalLotteryEnabledInput').checked) {
        lotteryConfig = {
            enabled: true,
            trigger_keywords: document.getElementById('modalLotteryTriggerKeywords').value.split(',').map(s => s.trim()).filter(s => s),
            reply_delay_min: parseInt(document.getElementById('modalLotteryDelayMin').value) || 3,
            reply_delay_max: parseInt(document.getElementById('modalLotteryDelayMax').value) || 10
        };
    }

    configData.groups.push({
        id: gid,
        name: document.getElementById('modalGroupName').value.trim(),
        default_notifiers: Array.from(document.querySelectorAll('#modalDefaultNotifyContainer input:checked')).map(el=>el.value),
        keywords: JSON.parse(JSON.stringify(addGroupKeywords)),
        lottery: lotteryConfig
    });
  
    if(await saveConfigToServer()) {
        closeAddGroupModal();
        renderGroups();
    }
};

document.getElementById('notifierForm').onsubmit = async function(e){
    e.preventDefault();
    configData.notifiers.email = {
        msmtp_host: document.getElementById('msmtp_host').value,
        msmtp_port: document.getElementById('msmtp_port').value,
        msmtp_user: document.getElementById('msmtp_user').value,
        msmtp_pass: document.getElementById('msmtp_pass').value,
        msmtp_from: document.getElementById('msmtp_from').value
    };
    if(await saveConfigToServer()) closeNotifierModal();
};

function logout(){ location.href="/logout"; }

renderGroups();

// 抽奖开关事件监听
document.getElementById('modalLotteryEnabledInput').addEventListener('change', function() {
    document.getElementById('modalLotterySettings').style.display = this.checked ? 'block' : 'none';
    document.getElementById('modalLotteryEnabled').classList.toggle('checked', this.checked);
});
</script>
</body>
</html>
